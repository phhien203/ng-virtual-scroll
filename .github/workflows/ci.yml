name: CI

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml
    with:
      node-version: '24'
      artifact-name: dist

  test:
    permissions:
      contents: read
    uses: ./.github/workflows/_test.yml
    with:
      node-version: '24'

  publish:
    if: github.event_name == 'push'
    needs: [build, test]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
