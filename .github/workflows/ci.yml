name: CI

on:
  pull_request:
    branches:
      - 'main'
      - 'feature/github'

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml
    with:
      node-version: '24'
      artifact-name: dist
