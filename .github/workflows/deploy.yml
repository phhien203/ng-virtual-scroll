name: Deploy

on:
  push:
    branches: [feature/github]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

# permissions:
#   contents: read

# concurrency:
#   group: ci-${{ github.ref }}
#   cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.5.2
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm verify

      - name: Upload artifact to github
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
