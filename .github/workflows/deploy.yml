name: Deploy

on:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: sha-${{ github.sha }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: login ghcr
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: build and push commit image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build --tag "ghcr.io/phhien203/ng-virtual-scroll:$IMAGE_TAG" .
          docker push "ghcr.io/phhien203/ng-virtual-scroll:$IMAGE_TAG"

      - name: publish release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          docker pull "ghcr.io/phhien203/ng-virtual-scroll:$IMAGE_TAG"
          docker tag "ghcr.io/phhien203/ng-virtual-scroll:$IMAGE_TAG" \
            "ghcr.io/phhien203/ng-virtual-scroll:$RELEASE_TAG"
          docker push "ghcr.io/phhien203/ng-virtual-scroll:$RELEASE_TAG"
