name: Deploy

on:
  push:
    branches:
      - 'main'
      - 'feature/github'
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml
    with:
      node-version: '24'
      artifact-name: dist

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build
    # environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifact from GitHub
        # actions/download-artifact v6
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: dist
          path: dist/

      - name: Configure AWS Credentials
        # aws-actions/configure-aws-credentials v6
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          aws-region: eu-north-1
          role-to-assume: arn:aws:iam::695496431016:role/ng-virtual-scroll

      - name: Upload artifact to AWS S3 bucket
        run: aws s3 sync dist/ng-virtual-scroll/browser s3://ng-virtual-scroll-bucket/ --delete
